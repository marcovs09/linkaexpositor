<!DOCTYPE html>
<html lang="pt-BR" class="h-full w-full overflow-hidden bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINKA - TV Display High Performance</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Orbitron & Rajdhani -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            color: #e2e8f0;
            user-select: none;
            background-color: #020617;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Efeitos Neon Leves e diretos (Alta Performance para GPU de TV) */
        .neon-text-cyan {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.4);
        }

        .neon-border-cyan {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3), inset 0 0 15px rgba(6, 182, 212, 0.2);
        }

        /* Varredura Lazer Futurista na Logo */
        .laser-sweep-container {
            position: relative;
            overflow: hidden;
        }

        .laser-sweep-container::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -150%;
            width: 80%;
            height: 300%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(0, 240, 255, 0.05) 20%,
                rgba(255, 255, 255, 0.9) 50%,
                rgba(0, 240, 255, 0.2) 70%,
                transparent 100%
            );
            transform: rotate(30deg) translate3d(0, 0, 0);
            will-change: transform;
            animation: laserSweep 4.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes laserSweep {
            0% {
                transform: rotate(30deg) translate3d(-200%, 0, 0);
            }
            35% {
                transform: rotate(30deg) translate3d(350%, 0, 0);
            }
            100% {
                transform: rotate(30deg) translate3d(350%, 0, 0);
            }
        }

        /* Flutuação 3D Otimizada */
        @keyframes levitate {
            0%, 100% {
                transform: translate3d(0, 0px, 0) scale(1);
            }
            50% {
                transform: translate3d(0, -14px, 0) scale(1.015);
            }
        }

        .floating-logo {
            animation: levitate 5s ease-in-out infinite;
            will-change: transform;
        }

        /* Anéis Holográficos com Aceleração por Hardware */
        @keyframes rotateHolo {
            0% { transform: rotate(0deg) translate3d(0,0,0); }
            100% { transform: rotate(360deg) translate3d(0,0,0); }
        }

        @keyframes rotateHoloRev {
            0% { transform: rotate(360deg) translate3d(0,0,0); }
            100% { transform: rotate(0deg) translate3d(0,0,0); }
        }

        .holo-ring-1 {
            animation: rotateHolo 20s linear infinite;
            will-change: transform;
        }

        .holo-ring-2 {
            animation: rotateHoloRev 14s linear infinite;
            will-change: transform;
        }

        /* Pulsar do Brilho Central */
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        .glow-bg {
            animation: pulseGlow 4s ease-in-out infinite;
            will-change: transform, opacity;
        }

        /* Overlay Scanline Levissímo */
        .scanline {
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 0, 0, 0.2) 51%
            );
            background-size: 100% 4px;
        }
    </style>
</head>
<body class="h-full w-full overflow-hidden bg-slate-950 flex items-center justify-center relative select-none">

    <!-- CANVAS DE PARTÍCULAS ULTRA LEVE (HYPERDRIVE TUNNEL) -->
    <canvas id="particleCanvas" class="absolute inset-0 w-full h-full z-0 pointer-events-none"></canvas>

    <!-- BRILHO RADIAL DE FUNDO (SEM BLUR) -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-cyan-950/40 via-slate-950/80 to-slate-950 z-0 pointer-events-none"></div>

    <!-- OVERLAY SCANLINE TV -->
    <div class="absolute inset-0 scanline opacity-25 pointer-events-none z-30"></div>

    <!-- MAIN CONTAINER PARA TV (16:9) -->
    <main class="relative w-full h-full max-w-[1920px] max-h-[1080px] flex flex-col justify-between p-8 sm:p-12 z-10 aspect-video overflow-hidden">

        <!-- ==================== HUD HEADER ==================== -->
        <header class="w-full flex justify-between items-start z-20">
            <!-- Canto Esquerdo: Status & Marca -->
            <div class="flex flex-col gap-1">
                <div class="flex items-center gap-3">
                    <span class="inline-block w-3 h-3 rounded-full bg-cyan-400 animate-ping"></span>
                    <span class="font-orbitron font-bold text-lg sm:text-xl tracking-widest text-cyan-400 uppercase neon-text-cyan">LINKA // DISPLAY OS</span>
                    <span class="text-xs px-2.5 py-0.5 rounded border border-cyan-500/50 bg-cyan-950/80 text-cyan-300 font-mono font-bold">4K ULTRA</span>
                </div>
                <div class="text-xs font-mono text-slate-400 flex gap-4 tracking-wider mt-1">
                    <span>SYS: <span class="text-emerald-400 font-bold">ONLINE</span></span>
                    <span>NET: <span class="text-cyan-400 font-bold">ACTIVE</span></span>
                    <span>PERF: <span id="fpsCounter" class="text-cyan-300 font-bold">60 FPS</span></span>
                </div>
            </div>

            <!-- Canto Direito: Relógio e Botão Fullscreen -->
            <div class="flex items-start gap-4">
                <div class="flex flex-col items-end">
                    <div id="clock" class="font-orbitron font-extrabold text-3xl sm:text-4xl text-cyan-300 tracking-wider neon-text-cyan">
                        00:00:00
                    </div>
                    <div id="date" class="text-xs font-mono text-slate-400 tracking-widest uppercase mt-1">
                        00 JAN 2026
                    </div>
                </div>

                <!-- Botão de Tela Cheia Otimizado -->
                <button id="fullscreenBtn" title="Alternar Tela Cheia" class="flex items-center justify-center p-3 sm:px-4 sm:py-2.5 rounded-xl border border-cyan-500/50 bg-slate-900/90 text-cyan-400 hover:text-cyan-200 hover:bg-cyan-950 transition-all shadow-lg active:scale-95 cursor-pointer font-mono text-xs tracking-wider neon-border-cyan">
                    <i id="fullscreenIcon" class="fa-solid fa-expand text-base"></i>
                    <span id="fullscreenText" class="hidden sm:inline-block ml-2 uppercase font-orbitron font-bold">TELA CHEIA</span>
                </button>
            </div>
        </header>

        <!-- ==================== CENTRO: LOGO LINKA ==================== -->
        <section class="relative w-full flex-1 flex items-center justify-center my-auto">
            
            <!-- Glow Neon Central sem Filtro de Blur -->
            <div class="absolute w-[28rem] h-[28rem] sm:w-[36rem] sm:h-[36rem] bg-[radial-gradient(circle,_rgba(0,216,255,0.25)_0%,_rgba(0,114,255,0.08)_50%,_transparent_70%)] rounded-full glow-bg pointer-events-none"></div>

            <!-- Anel Holográfico Exterior -->
            <div class="absolute w-[32rem] h-[32rem] sm:w-[42rem] sm:h-[42rem] rounded-full border border-cyan-500/30 border-dashed holo-ring-1 pointer-events-none"></div>

            <!-- Anel Holográfico Secundário com Marcadores -->
            <div class="absolute w-[24rem] h-[24rem] sm:w-[32rem] sm:h-[32rem] rounded-full border-2 border-blue-500/20 border-t-cyan-400/80 border-b-cyan-400/80 holo-ring-2 pointer-events-none"></div>

            <!-- CONTAINER DA LOGO COM FLUTUAÇÃO 3D E VARREDURA LAZER -->
            <div class="relative z-20 floating-logo laser-sweep-container p-6 rounded-3xl">
                
                <!-- SVG VETORIAL LINKA -->
                <svg class="w-[82vw] max-w-[880px] h-auto filter drop-shadow-[0_10px_25px_rgba(0,150,255,0.3)]" viewBox="0 0 1000 320" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Gradiente Metálico Azul Principal -->
                        <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00f0ff" />
                            <stop offset="45%" stop-color="#0072ff" />
                            <stop offset="85%" stop-color="#002699" />
                            <stop offset="100%" stop-color="#001144" />
                        </linearGradient>

                        <!-- Gradiente Cyan para a Letra A -->
                        <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#38bdf8" />
                            <stop offset="50%" stop-color="#0284c7" />
                            <stop offset="100%" stop-color="#0369a1" />
                        </linearGradient>

                        <!-- Sombra do Efeito 3D Metálico Interno -->
                        <linearGradient id="metalBevel" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
                            <stop offset="20%" stop-color="#ffffff" stop-opacity="0.1" />
                            <stop offset="80%" stop-color="#000000" stop-opacity="0.4" />
                            <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
                        </linearGradient>
                    </defs>

                    <!-- ÍCONE LINK/S -->
                    <g>
                        <!-- Camada de Cor Principal -->
                        <path d="M 230,50 C 260,50 285,75 285,105 L 285,115 C 285,135 270,150 250,150 L 160,150 C 130,150 105,175 105,205 L 105,215 C 105,245 130,270 160,270 L 230,270 L 180,320 L 150,320 C 90,320 40,270 40,210 L 40,195 C 40,135 90,85 150,85 L 200,85 Z" fill="url(#mainGradient)"/>
                        <path d="M 110,270 C 80,270 55,245 55,215 L 55,205 C 55,185 70,170 90,170 L 180,170 C 210,170 235,145 235,115 L 235,105 C 235,75 210,50 180,50 L 110,50 L 160,0 L 190,0 C 250,0 300,50 300,110 L 300,125 C 300,185 250,235 190,235 L 140,235 Z" fill="url(#mainGradient)"/>
                        
                        <!-- Overlay Metálico 3D -->
                        <path d="M 230,50 C 260,50 285,75 285,105 L 285,115 C 285,135 270,150 250,150 L 160,150 C 130,150 105,175 105,205 L 105,215 C 105,245 130,270 160,270 L 230,270 L 180,320 L 150,320 C 90,320 40,270 40,210 L 40,195 C 40,135 90,85 150,85 L 200,85 Z" fill="url(#metalBevel)"/>
                        <path d="M 110,270 C 80,270 55,245 55,215 L 55,205 C 55,185 70,170 90,170 L 180,170 C 210,170 235,145 235,115 L 235,105 C 235,75 210,50 180,50 L 110,50 L 160,0 L 190,0 C 250,0 300,50 300,110 L 300,125 C 300,185 250,235 190,235 L 140,235 Z" fill="url(#metalBevel)"/>
                    </g>

                    <!-- TEXTO LINKA -->
                    <!-- L -->
                    <path d="M 340,90 L 380,90 L 380,225 L 450,225 L 450,265 L 340,265 Z" fill="url(#mainGradient)"/>
                    <path d="M 340,90 L 380,90 L 380,225 L 450,225 L 450,265 L 340,265 Z" fill="url(#metalBevel)"/>
                    
                    <!-- I -->
                    <path d="M 470,90 L 510,90 L 510,265 L 470,265 Z" fill="url(#mainGradient)"/>
                    <path d="M 470,90 L 510,90 L 510,265 L 470,265 Z" fill="url(#metalBevel)"/>
                    
                    <!-- N -->
                    <path d="M 535,90 L 575,90 L 625,190 L 625,90 L 665,90 L 665,265 L 625,265 L 575,165 L 575,265 L 535,265 Z" fill="url(#mainGradient)"/>
                    <path d="M 535,90 L 575,90 L 625,190 L 625,90 L 665,90 L 665,265 L 625,265 L 575,165 L 575,265 L 535,265 Z" fill="url(#metalBevel)"/>
                    
                    <!-- K -->
                    <path d="M 690,90 L 730,90 L 730,160 L 775,90 L 825,90 L 765,175 L 830,265 L 780,265 L 730,190 L 730,265 L 690,265 Z" fill="url(#mainGradient)"/>
                    <path d="M 690,90 L 730,90 L 730,160 L 775,90 L 825,90 L 765,175 L 830,265 L 780,265 L 730,190 L 730,265 L 690,265 Z" fill="url(#metalBevel)"/>
                    
                    <!-- A -->
                    <path d="M 885,90 L 925,90 L 985,265 L 940,265 L 925,220 L 885,220 L 870,265 L 825,265 Z M 905,140 L 892,185 L 918,185 Z" fill="url(#cyanGradient)"/>
                    <path d="M 885,90 L 925,90 L 985,265 L 940,265 L 925,220 L 885,220 L 870,265 L 825,265 Z M 905,140 L 892,185 L 918,185 Z" fill="url(#metalBevel)"/>
                </svg>

            </div>
        </section>

        <!-- ==================== HUD FOOTER ==================== -->
        <footer class="w-full flex justify-between items-end z-20">
            <div class="flex items-center gap-6">
                <div class="border-l-2 border-cyan-400 pl-3">
                    <p class="text-[10px] font-mono text-slate-400 uppercase tracking-widest">SMART TV ENGINE</p>
                    <p class="text-xs sm:text-sm font-orbitron text-cyan-300 font-bold">GPU ACCELERATED</p>
                </div>
            </div>

            <div class="hidden md:flex items-center gap-3 px-6 py-2 rounded-full border border-cyan-500/30 bg-slate-900/90 shadow-lg">
                <i class="fa-solid fa-atom text-cyan-400 animate-spin" style="animation-duration: 8s;"></i>
                <span class="text-xs font-mono text-cyan-200 tracking-wider uppercase">LINKA INNOVATION &bull; CONTINUOUS DISPLAY LOOP</span>
            </div>

            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                <span class="text-xs font-mono text-slate-400 tracking-widest">SYSTEM READY</span>
            </div>
        </footer>

        <!-- MOLDURAS FUTURISTAS NOS CANTOS -->
        <div class="absolute top-4 left-4 w-6 h-6 border-t-2 border-l-2 border-cyan-400/70 pointer-events-none"></div>
        <div class="absolute top-4 right-4 w-6 h-6 border-t-2 border-r-2 border-cyan-400/70 pointer-events-none"></div>
        <div class="absolute bottom-4 left-4 w-6 h-6 border-b-2 border-l-2 border-cyan-400/70 pointer-events-none"></div>
        <div class="absolute bottom-4 right-4 w-6 h-6 border-b-2 border-r-2 border-cyan-400/70 pointer-events-none"></div>
    </main>

    <script>
        // ==========================================
        // CANVAS DE PARTÍCULAS ULTRA LEVE (60 FPS)
        // ==========================================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Otimização crítica de GPU

        let width, height;
        let particles = [];
        const particleCount = 28; // Quantidade perfeita para não causar lag em TVs

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = (Math.random() - 0.5) * width * 1.5;
                this.y = (Math.random() - 0.5) * height * 1.5;
                this.z = Math.random() * 1000 + 1;
                this.vz = -2.5; // Velocidade do Túnel
                this.size = Math.random() * 2 + 1;
                this.color = Math.random() > 0.4 ? '#00f0ff' : '#0072ff';
            }

            update() {
                this.z += this.vz;
                if (this.z <= 1) {
                    this.reset();
                    this.z = 1000;
                }
            }

            draw() {
                const k = 400 / this.z;
                const px = this.x * k + width / 2;
                const py = this.y * k + height / 2;

                if (px < 0 || px > width || py < 0 || py > height) return;

                const alpha = Math.min(1, (1 - this.z / 1000) * 1.2);

                ctx.beginPath();
                ctx.arc(px, py, this.size * k * 0.8, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = alpha;
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        // Loop de Animação
        let lastTime = performance.now();
        let frameCount = 0;
        const fpsElement = document.getElementById('fpsCounter');

        function animate(currentTime) {
            // Limpa canvas com a cor de fundo sólida (extremamente rápido)
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }

            // Monitor de FPS
            frameCount++;
            if (currentTime - lastTime >= 1000) {
                if (fpsElement) fpsElement.textContent = `${frameCount} FPS`;
                frameCount = 0;
                lastTime = currentTime;
            }

            requestAnimationFrame(animate);
        }

        // Relógio
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

            const dateStr = now.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
            document.getElementById('date').textContent = dateStr;
        }

        setInterval(updateClock, 1000);
        updateClock();

        // Controles de Tela Cheia (Fullscreen)
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const fullscreenText = document.getElementById('fullscreenText');

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const docEl = document.documentElement;
                if (docEl.requestFullscreen) docEl.requestFullscreen();
                else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        function updateFullscreenUI() {
            const isFS = document.fullscreenElement || document.webkitFullscreenElement;
            if (isFS) {
                fullscreenIcon.className = "fa-solid fa-compress text-base";
                fullscreenText.textContent = "SAIR";
            } else {
                fullscreenIcon.className = "fa-solid fa-expand text-base";
                fullscreenText.textContent = "TELA CHEIA";
            }
        }

        fullscreenBtn.addEventListener('click', toggleFullscreen);
        document.addEventListener('fullscreenchange', updateFullscreenUI);
        document.addEventListener('webkitfullscreenchange', updateFullscreenUI);

        window.onload = function() {
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
