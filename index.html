<!DOCTYPE html>
<html lang="pt-BR" class="h-full w-full overflow-hidden bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINKA - Futuristic TV Display</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Orbitron & Rajdhani para visual Futurista/Cyberpunk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            color: #e2e8f0;
            user-select: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Efeito Glow Neon para SVG e Textos */
        .neon-glow-cyan {
            filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.8)) drop-shadow(0 0 35px rgba(6, 182, 212, 0.4));
        }

        .neon-glow-blue {
            filter: drop-shadow(0 0 20px rgba(37, 99, 235, 0.8)) drop-shadow(0 0 45px rgba(37, 99, 235, 0.5));
        }

        /* Sweep de Luz Metallic sobre a logo */
        .shine-effect {
            position: relative;
            overflow: hidden;
        }

        .shine-effect::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -150%;
            width: 100%;
            height: 200%;
            background: linear-gradient(
                60deg,
                transparent 30%,
                rgba(255, 255, 255, 0.1) 45%,
                rgba(0, 240, 255, 0.6) 50%,
                rgba(255, 255, 255, 0.1) 55%,
                transparent 70%
            );
            transform: rotate(25deg);
            animation: lightSweep 6s infinite ease-in-out;
        }

        @keyframes lightSweep {
            0% { left: -150%; opacity: 0; }
            20% { opacity: 1; }
            40% { left: 150%; opacity: 0; }
            100% { left: 150%; opacity: 0; }
        }

        /* Animação de Flutuação 3D Continuo */
        @keyframes levitate {
            0%, 100% {
                transform: translateY(0px) rotateX(2deg) rotateY(-2deg) scale(1);
            }
            50% {
                transform: translateY(-16px) rotateX(-2deg) rotateY(2deg) scale(1.02);
            }
        }

        .floating-logo {
            animation: levitate 8s ease-in-out infinite;
            transform-style: preserve-3d;
        }

        /* Efeitos de Anéis Holográficos */
        @keyframes rotateHolo {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.05); }
            100% { transform: rotate(360deg) scale(1); }
        }

        @keyframes rotateHoloRev {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        .holo-ring-1 {
            animation: rotateHolo 20s linear infinite;
        }

        .holo-ring-2 {
            animation: rotateHoloRev 14s linear infinite;
        }

        /* Grid Cyberpunk de Fundo em Perspectiva */
        .cyber-grid {
            background-image: 
                linear-gradient(to right, rgba(6, 182, 212, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(6, 182, 212, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: center 80%;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 400px; }
        }

        /* Efeito Scanline de TV Sci-Fi */
        .scanline {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.3) 50%,
                rgba(0, 0, 0, 0.3)
            );
            background-size: 100% 4px;
        }

        /* Animação do HUD */
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.9; }
        }

        .hud-pulse {
            animation: pulseGlow 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="h-full w-full overflow-hidden bg-slate-950 flex items-center justify-center relative select-none">

    <!-- CANVAS 3D / PARTÍCULAS DE FUNDO -->
    <canvas id="particleCanvas" class="absolute inset-0 w-full h-full z-0 pointer-events-none"></canvas>

    <!-- GRID CIBERNÉTICO INFERIOR -->
    <div class="absolute inset-x-0 bottom-0 h-[60vh] cyber-grid opacity-30 pointer-events-none z-0"></div>

    <!-- EFEITO GRADIENTE RADIAL CENTRAL -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-cyan-950/40 via-slate-950/80 to-slate-950 z-0"></div>

    <!-- OVERLAY SCANLINE TV -->
    <div class="absolute inset-0 scanline opacity-40 pointer-events-none z-30"></div>

    <!-- MAIN 16:9 CONTAINER PARA TV -->
    <main class="relative w-full h-full max-w-[1920px] max-h-[1080px] flex flex-col justify-between p-8 sm:p-12 z-10 aspect-video overflow-hidden">

        <!-- ==================== HUD HEADER ==================== -->
        <header class="w-full flex justify-between items-start z-20">
            <!-- Canto Esquerdo: Status & Marca -->
            <div class="flex flex-col gap-1">
                <div class="flex items-center gap-3">
                    <span class="inline-block w-3 h-3 rounded-full bg-cyan-400 animate-ping"></span>
                    <span class="font-orbitron font-bold text-lg tracking-widest text-cyan-400 uppercase">LINKA // OS 4.0</span>
                    <span class="text-xs px-2 py-0.5 rounded border border-cyan-500/40 bg-cyan-950/50 text-cyan-300 font-mono">LIVE DISPLAY</span>
                </div>
                <div class="text-xs font-mono text-slate-400 flex gap-4 tracking-wider mt-1">
                    <span>SYS: <span class="text-emerald-400">ONLINE</span></span>
                    <span>NET: <span class="text-cyan-400">10 Gbps</span></span>
                    <span>NODE: <span class="text-blue-400">BR-SPO-01</span></span>
                </div>
            </div>

            <!-- Canto Direito: Relógio e Data em Tempo Real -->
            <div class="flex flex-col items-end">
                <div id="clock" class="font-orbitron font-extrabold text-3xl sm:text-4xl text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-400 to-indigo-300 tracking-wider neon-glow-cyan">
                    00:00:00
                </div>
                <div id="date" class="text-xs font-mono text-slate-400 tracking-widest uppercase mt-1">
                    00 JAN 2026
                </div>
            </div>
        </header>

        <!-- ==================== CENTRO: LOGO LINKA + ANÉIS HOLOGRÁFICOS ==================== -->
        <section class="relative w-full flex-1 flex items-center justify-center my-auto">
            
            <!-- Anel Holográfico Exterior -->
            <div class="absolute w-[34rem] h-[34rem] sm:w-[42rem] sm:h-[42rem] rounded-full border border-cyan-500/20 border-dashed holo-ring-1 pointer-events-none flex items-center justify-center">
                <div class="w-full h-full rounded-full border-t-2 border-b-2 border-cyan-400/40"></div>
            </div>

            <!-- Anel Holográfico Secundário Inverso -->
            <div class="absolute w-[26rem] h-[26rem] sm:w-[32rem] sm:h-[32rem] rounded-full border-2 border-blue-600/30 border-dotted holo-ring-2 pointer-events-none"></div>

            <!-- Glowing Cyber Orb Center Backing -->
            <div class="absolute w-80 h-80 bg-gradient-to-tr from-blue-600/30 to-cyan-400/30 rounded-full blur-3xl hud-pulse pointer-events-none"></div>

            <!-- CONTAINER DA LOGO COM FLUTUAÇÃO 3D -->
            <div class="relative z-20 floating-logo shine-effect p-8 sm:p-12 rounded-3xl backdrop-blur-xs">
                
                <!-- SVG VETORIAL EXATO DA LOGO LINKA -->
                <svg class="w-[80vw] max-w-[850px] h-auto filter neon-glow-blue" viewBox="0 0 1000 320" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Gradiente Metálico para o S / Ícone -->
                        <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00d8ff" />
                            <stop offset="40%" stop-color="#0072ff" />
                            <stop offset="100%" stop-color="#002b99" />
                        </linearGradient>

                        <!-- Gradiente Metálico Azul para as Letras LIN -->
                        <linearGradient id="darkMetalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#1e293b" />
                            <stop offset="35%" stop-color="#0f172a" />
                            <stop offset="70%" stop-color="#090d16" />
                            <stop offset="100%" stop-color="#020617" />
                        </linearGradient>

                        <!-- Gradiente Cyan Brilhante para a Letra A -->
                        <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#38bdf8" />
                            <stop offset="50%" stop-color="#0284c7" />
                            <stop offset="100%" stop-color="#0369a1" />
                        </linearGradient>

                        <!-- Sombra Projetada 3D -->
                        <filter id="shadow3D" x="-10%" y="-10%" width="130%" height="130%">
                            <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#00f0ff" flood-opacity="0.3"/>
                            <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
                        </filter>
                    </defs>

                    <!-- SIMBOLO / ÍCONE "LINK / S" ESTILIZADO -->
                    <g filter="url(#shadow3D)">
                        <!-- Parte Externa Superior e Curva do Ícone -->
                        <path d="M 230,50 
                                 C 260,50 285,75 285,105 
                                 L 285,115 
                                 C 285,135 270,150 250,150 
                                 L 160,150 
                                 C 130,150 105,175 105,205 
                                 L 105,215 
                                 C 105,245 130,270 160,270 
                                 L 230,270 
                                 L 180,320 
                                 L 150,320 
                                 C 90,320 40,270 40,210 
                                 L 40,195 
                                 C 40,135 90,85 150,85 
                                 L 200,85 
                                 Z" 
                              fill="url(#iconGradient)"/>

                        <!-- Parte Externa Inferior e Curva oposta -->
                        <path d="M 110,270 
                                 C 80,270 55,245 55,215 
                                 L 55,205 
                                 C 55,185 70,170 90,170 
                                 L 180,170 
                                 C 210,170 235,145 235,115 
                                 L 235,105 
                                 C 235,75 210,50 180,50 
                                 L 110,50 
                                 L 160,0 
                                 L 190,0 
                                 C 250,0 300,50 300,110 
                                 L 300,125 
                                 C 300,185 250,235 190,235 
                                 L 140,235 
                                 Z" 
                              fill="url(#iconGradient)"/>
                    </g>

                    <!-- TYPOGRAPHY "LINKA" COM ESTILO 3D CORRESPONDE À LOGO -->
                    <!-- L -->
                    <path d="M 340,90 L 380,90 L 380,225 L 450,225 L 450,265 L 340,265 Z" 
                          fill="url(#iconGradient)" stroke="#0284c7" stroke-width="2"/>

                    <!-- I -->
                    <path d="M 470,90 L 510,90 L 510,265 L 470,265 Z" 
                          fill="url(#iconGradient)" stroke="#0284c7" stroke-width="2"/>

                    <!-- N -->
                    <path d="M 535,90 L 575,90 L 625,190 L 625,90 L 665,90 L 665,265 L 625,265 L 575,165 L 575,265 L 535,265 Z" 
                          fill="url(#iconGradient)" stroke="#0284c7" stroke-width="2"/>

                    <!-- K -->
                    <path d="M 690,90 L 730,90 L 730,160 L 775,90 L 825,90 L 765,175 L 830,265 L 780,265 L 730,190 L 730,265 L 690,265 Z" 
                          fill="url(#iconGradient)" stroke="#0284c7" stroke-width="2"/>

                    <!-- A (Estilizada Futurista em Cyan Neon) -->
                    <path d="M 885,90 L 925,90 L 985,265 L 940,265 L 925,220 L 885,220 L 870,265 L 825,265 Z M 905,140 L 892,185 L 918,185 Z" 
                          fill="url(#cyanGradient)" stroke="#38bdf8" stroke-width="2" class="neon-glow-cyan"/>
                </svg>

            </div>
        </section>

        <!-- ==================== HUD FOOTER ==================== -->
        <footer class="w-full flex justify-between items-end z-20">
            <!-- Canto Inferior Esquerdo: Informações de Performance / Telemetria -->
            <div class="flex items-center gap-6">
                <div class="border-l-2 border-cyan-500 pl-3">
                    <p class="text-[10px] font-mono text-slate-400 uppercase tracking-widest">DISPLAY RESOLUTION</p>
                    <p class="text-sm font-orbitron text-cyan-300 font-bold">3840 x 2160 UHD</p>
                </div>
                <div class="hidden sm:block border-l-2 border-blue-500 pl-3">
                    <p class="text-[10px] font-mono text-slate-400 uppercase tracking-widest">FRAME RATE</p>
                    <p id="fpsCounter" class="text-sm font-orbitron text-blue-300 font-bold">60 FPS</p>
                </div>
            </div>

            <!-- Ticker de Informações / Mensagem Rodapé -->
            <div class="hidden md:flex items-center gap-3 px-6 py-2 rounded-full border border-cyan-500/20 bg-slate-900/60 backdrop-blur-md">
                <i class="fa-solid fa-atom text-cyan-400 animate-spin"></i>
                <span class="text-xs font-mono text-cyan-200 tracking-wider uppercase">LINKA CONNECTIVITY NETWORK &bull; INNOVATION IN MOTION</span>
            </div>

            <!-- Canto Inferior Direito: Indicador Visual Tech -->
            <div class="flex items-center gap-2">
                <div class="flex gap-1 items-end h-6">
                    <span class="w-1 bg-cyan-500 h-2 animate-pulse"></span>
                    <span class="w-1 bg-cyan-400 h-4 animate-pulse" style="animation-delay: 0.2s"></span>
                    <span class="w-1 bg-blue-500 h-6 animate-pulse" style="animation-delay: 0.4s"></span>
                    <span class="w-1 bg-cyan-300 h-3 animate-pulse" style="animation-delay: 0.1s"></span>
                </div>
                <span class="text-xs font-mono text-slate-400 tracking-widest ml-2">SYSTEM ACTIVE</span>
            </div>
        </footer>

        <!-- MOLDURAS FUTURISTAS NOS CANTOS DA TELA -->
        <div class="absolute top-4 left-4 w-8 h-8 border-t-2 border-l-2 border-cyan-400 pointer-events-none"></div>
        <div class="absolute top-4 right-4 w-8 h-8 border-t-2 border-r-2 border-cyan-400 pointer-events-none"></div>
        <div class="absolute bottom-4 left-4 w-8 h-8 border-b-2 border-l-2 border-cyan-400 pointer-events-none"></div>
        <div class="absolute bottom-4 right-4 w-8 h-8 border-b-2 border-r-2 border-cyan-400 pointer-events-none"></div>
    </main>

    <!-- SCRIPT DA ANIMAÇÃO DE PARTÍCULAS 3D E LÓGICA DO HUD -->
    <script>
        // ==========================================
        // 1. ANIMAÇÃO DE CANVAS 3D / CAMPO DE PARTÍCULAS
        // ==========================================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        const particleCount = 120; // Quantidade de nós de partículas

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = (Math.random() - 0.5) * width * 1.5;
                this.y = (Math.random() - 0.5) * height * 1.5;
                this.z = Math.random() * 1000 + 1;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.vz = -1.5 - Math.random() * 1.5; // Movimento em direção à tela
                this.radius = Math.random() * 2 + 1;
                this.color = Math.random() > 0.4 ? '#00f0ff' : '#0066ff';
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.z += this.vz;

                // Reinicia quando chega muito perto da tela
                if (this.z <= 1) {
                    this.reset();
                    this.z = 1000;
                }
            }

            draw() {
                // Projeção 3D para 2D
                const k = 400 / this.z;
                const px = this.x * k + width / 2;
                const py = this.y * k + height / 2;

                if (px < 0 || px > width || py < 0 || py > height) return;

                const size = Math.max(0.1, (1 - this.z / 1000) * this.radius * 2.5);
                const alpha = (1 - this.z / 1000) * 0.8;

                ctx.beginPath();
                ctx.arc(px, py, size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = alpha;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // Inicialização de Partículas
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        // Desenhar Teia/Linhas Conectando Nós Próximos
        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const p1 = particles[i];
                    const p2 = particles[j];

                    // Calcula distância aproximada 3D
                    const dx = p1.x - p2.x;
                    const dy = p1.y - p2.y;
                    const dz = p1.z - p2.z;
                    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

                    if (dist < 180) {
                        const k1 = 400 / p1.z;
                        const k2 = 400 / p2.z;
                        const x1 = p1.x * k1 + width / 2;
                        const y1 = p1.y * k1 + height / 2;
                        const x2 = p2.x * k2 + width / 2;
                        const y2 = p2.y * k2 + height / 2;

                        const alpha = (1 - dist / 180) * 0.25 * (1 - p1.z / 1000);

                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.strokeStyle = '#00d8ff';
                        ctx.globalAlpha = alpha;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }
        }

        // Loop de Renderização
        let lastTime = performance.now();
        let frameCount = 0;
        const fpsElement = document.getElementById('fpsCounter');

        function animate(currentTime) {
            ctx.clearRect(0, 0, width, height);

            // Atualizar e Desenhar Partículas
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            drawConnections();

            // Contador de FPS
            frameCount++;
            if (currentTime - lastTime >= 1000) {
                if (fpsElement) fpsElement.textContent = `${frameCount} FPS`;
                frameCount = 0;
                lastTime = currentTime;
            }

            requestAnimationFrame(animate);
        }

        // ==========================================
        // 2. RELÓGIO E DATA EM TEMPO REAL
        // ==========================================
        function updateClock() {
            const now = new Date();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

            const options = { day: '2-digit', month: 'SHORT', year: 'NUMERIC' };
            const dateStr = now.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
            document.getElementById('date').textContent = dateStr;
        }

        setInterval(updateClock, 1000);
        updateClock();

        // Inicia a Animação ao Carregar
        window.onload = function() {
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
