<!DOCTYPE html>
<html lang="pt-BR" class="h-full w-full overflow-hidden bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINKA - TV Display High Performance</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Orbitron & Rajdhani -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            color: #e2e8f0;
            user-select: none;
            background-color: #020617;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Efeitos Neon Leves para GPU de TV */
        .neon-text-cyan {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.7);
        }

        .neon-box-blue {
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.3);
        }

        /* Sweep de Luz Metallic - Otimizado com transform3d */
        .shine-effect {
            position: relative;
            overflow: hidden;
        }

        .shine-effect::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -150%;
            width: 100%;
            height: 200%;
            background: linear-gradient(
                60deg,
                transparent 30%,
                rgba(255, 255, 255, 0.08) 45%,
                rgba(0, 240, 255, 0.5) 50%,
                rgba(255, 255, 255, 0.08) 55%,
                transparent 70%
            );
            transform: rotate(25deg) translate3d(0,0,0);
            will-change: transform;
            animation: lightSweep 7s infinite linear;
        }

        @keyframes lightSweep {
            0% { transform: rotate(25deg) translate3d(-150%, 0, 0); opacity: 0; }
            15% { opacity: 1; }
            35% { transform: rotate(25deg) translate3d(150%, 0, 0); opacity: 0; }
            100% { transform: rotate(25deg) translate3d(150%, 0, 0); opacity: 0; }
        }

        /* Animação de Flutuação Suave 3D Otimizada */
        @keyframes levitate {
            0%, 100% {
                transform: translate3d(0, 0px, 0) rotateX(1deg);
            }
            50% {
                transform: translate3d(0, -12px, 0) rotateX(-1deg);
            }
        }

        .floating-logo {
            animation: levitate 6s ease-in-out infinite;
            will-change: transform;
        }

        /* Anéis Holográficos Simplificados */
        @keyframes rotateHolo {
            0% { transform: rotate(0deg) translate3d(0,0,0); }
            100% { transform: rotate(360deg) translate3d(0,0,0); }
        }

        @keyframes rotateHoloRev {
            0% { transform: rotate(360deg) translate3d(0,0,0); }
            100% { transform: rotate(0deg) translate3d(0,0,0); }
        }

        .holo-ring-1 {
            animation: rotateHolo 25s linear infinite;
            will-change: transform;
        }

        .holo-ring-2 {
            animation: rotateHoloRev 18s linear infinite;
            will-change: transform;
        }

        /* Scanline TV Leve (sem filtros de mesclagem) */
        .scanline {
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 0, 0, 0.25) 51%
            );
            background-size: 100% 4px;
        }
    </style>
</head>
<body class="h-full w-full overflow-hidden bg-slate-950 flex items-center justify-center relative select-none">

    <!-- CANVAS DE PARTÍCULAS LEVE -->
    <canvas id="particleCanvas" class="absolute inset-0 w-full h-full z-0 pointer-events-none"></canvas>

    <!-- GRADIENTE RADIAL ESTÁTICO DE FUNDO (SEM BLUR) -->
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-cyan-950/30 via-slate-950/80 to-slate-950 z-0 pointer-events-none"></div>

    <!-- OVERLAY SCANLINE TV -->
    <div class="absolute inset-0 scanline opacity-30 pointer-events-none z-30"></div>

    <!-- MAIN CONTAINER PARA TV (16:9) -->
    <main class="relative w-full h-full max-w-[1920px] max-h-[1080px] flex flex-col justify-between p-8 sm:p-12 z-10 aspect-video overflow-hidden">

        <!-- ==================== HUD HEADER ==================== -->
        <header class="w-full flex justify-between items-start z-20">
            <!-- Canto Esquerdo: Status & Marca -->
            <div class="flex flex-col gap-1">
                <div class="flex items-center gap-3">
                    <span class="inline-block w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></span>
                    <span class="font-orbitron font-bold text-lg tracking-widest text-cyan-400 uppercase neon-text-cyan">LINKA // OS 4.0</span>
                    <span class="text-xs px-2 py-0.5 rounded border border-cyan-500/40 bg-cyan-950/70 text-cyan-300 font-mono">TV DISPLAY</span>
                </div>
                <div class="text-xs font-mono text-slate-400 flex gap-4 tracking-wider mt-1">
                    <span>SYS: <span class="text-emerald-400">ONLINE</span></span>
                    <span>NET: <span class="text-cyan-400">10 Gbps</span></span>
                    <span>FPS: <span id="fpsCounter" class="text-blue-400">--</span></span>
                </div>
            </div>

            <!-- Canto Direito: Relógio e Botão Fullscreen -->
            <div class="flex items-start gap-4">
                <div class="flex flex-col items-end">
                    <div id="clock" class="font-orbitron font-extrabold text-3xl sm:text-4xl text-cyan-300 tracking-wider neon-text-cyan">
                        00:00:00
                    </div>
                    <div id="date" class="text-xs font-mono text-slate-400 tracking-widest uppercase mt-1">
                        00 JAN 2026
                    </div>
                </div>

                <!-- Botão de Tela Cheia Otimizado -->
                <button id="fullscreenBtn" title="Alternar Tela Cheia" class="flex items-center justify-center p-3 sm:px-4 sm:py-2.5 rounded-lg border border-cyan-500/50 bg-slate-900 text-cyan-400 hover:text-cyan-200 hover:bg-cyan-950 transition-colors shadow-lg active:scale-95 cursor-pointer font-mono text-xs tracking-wider">
                    <i id="fullscreenIcon" class="fa-solid fa-expand text-base"></i>
                    <span id="fullscreenText" class="hidden sm:inline-block ml-2 uppercase font-orbitron font-bold">FULLSCREEN</span>
                </button>
            </div>
        </header>

        <!-- ==================== CENTRO: LOGO LINKA ==================== -->
        <section class="relative w-full flex-1 flex items-center justify-center my-auto">
            
            <!-- Anel Holográfico Exterior Simplificado -->
            <div class="absolute w-[32rem] h-[32rem] sm:w-[40rem] sm:h-[40rem] rounded-full border border-cyan-500/20 border-dashed holo-ring-1 pointer-events-none"></div>

            <!-- Anel Holográfico Secundário Inverso -->
            <div class="absolute w-[24rem] h-[24rem] sm:w-[30rem] sm:h-[30rem] rounded-full border border-blue-500/30 holo-ring-2 pointer-events-none"></div>

            <!-- Glow Central Estático -->
            <div class="absolute w-72 h-72 bg-cyan-500/10 rounded-full pointer-events-none"></div>

            <!-- CONTAINER DA LOGO COM FLUTUAÇÃO SUAVE -->
            <div class="relative z-20 floating-logo shine-effect p-6 rounded-3xl">
                
                <!-- SVG VETORIAL OTIMIZADO -->
                <svg class="w-[80vw] max-w-[850px] h-auto" viewBox="0 0 1000 320" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Gradientes Leves -->
                        <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00d8ff" />
                            <stop offset="50%" stop-color="#0072ff" />
                            <stop offset="100%" stop-color="#002b99" />
                        </linearGradient>

                        <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#38bdf8" />
                            <stop offset="100%" stop-color="#0284c7" />
                        </linearGradient>
                    </defs>

                    <!-- ÍCONE LINK/S -->
                    <g>
                        <path d="M 230,50 C 260,50 285,75 285,105 L 285,115 C 285,135 270,150 250,150 L 160,150 C 130,150 105,175 105,205 L 105,215 C 105,245 130,270 160,270 L 230,270 L 180,320 L 150,320 C 90,320 40,270 40,210 L 40,195 C 40,135 90,85 150,85 L 200,85 Z" fill="url(#iconGradient)"/>
                        <path d="M 110,270 C 80,270 55,245 55,215 L 55,205 C 55,185 70,170 90,170 L 180,170 C 210,170 235,145 235,115 L 235,105 C 235,75 210,50 180,50 L 110,50 L 160,0 L 190,0 C 250,0 300,50 300,110 L 300,125 C 300,185 250,235 190,235 L 140,235 Z" fill="url(#iconGradient)"/>
                    </g>

                    <!-- TEXTO LINKA -->
                    <path d="M 340,90 L 380,90 L 380,225 L 450,225 L 450,265 L 340,265 Z" fill="url(#iconGradient)"/>
                    <path d="M 470,90 L 510,90 L 510,265 L 470,265 Z" fill="url(#iconGradient)"/>
                    <path d="M 535,90 L 575,90 L 625,190 L 625,90 L 665,90 L 665,265 L 625,265 L 575,165 L 575,265 L 535,265 Z" fill="url(#iconGradient)"/>
                    <path d="M 690,90 L 730,90 L 730,160 L 775,90 L 825,90 L 765,175 L 830,265 L 780,265 L 730,190 L 730,265 L 690,265 Z" fill="url(#iconGradient)"/>
                    <path d="M 885,90 L 925,90 L 985,265 L 940,265 L 925,220 L 885,220 L 870,265 L 825,265 Z M 905,140 L 892,185 L 918,185 Z" fill="url(#cyanGradient)"/>
                </svg>

            </div>
        </section>

        <!-- ==================== HUD FOOTER ==================== -->
        <footer class="w-full flex justify-between items-end z-20">
            <div class="flex items-center gap-6">
                <div class="border-l-2 border-cyan-500 pl-3">
                    <p class="text-[10px] font-mono text-slate-400 uppercase tracking-widest">DISPLAY RESOLUTION</p>
                    <p class="text-sm font-orbitron text-cyan-300 font-bold">4K UHD TUNED</p>
                </div>
            </div>

            <div class="hidden md:flex items-center gap-3 px-6 py-1.5 rounded-full border border-cyan-500/30 bg-slate-900/90">
                <i class="fa-solid fa-bolt text-cyan-400"></i>
                <span class="text-xs font-mono text-cyan-200 tracking-wider uppercase">LINKA CONNECTIVITY NETWORK &bull; HIGH PERFORMANCE DISPLAY</span>
            </div>

            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                <span class="text-xs font-mono text-slate-400 tracking-widest">SYSTEM READY</span>
            </div>
        </footer>

        <!-- MOLDURAS FUTURISTAS NOS CANTOS -->
        <div class="absolute top-4 left-4 w-6 h-6 border-t-2 border-l-2 border-cyan-400/60 pointer-events-none"></div>
        <div class="absolute top-4 right-4 w-6 h-6 border-t-2 border-r-2 border-cyan-400/60 pointer-events-none"></div>
        <div class="absolute bottom-4 left-4 w-6 h-6 border-b-2 border-l-2 border-cyan-400/60 pointer-events-none"></div>
        <div class="absolute bottom-4 right-4 w-6 h-6 border-b-2 border-r-2 border-cyan-400/60 pointer-events-none"></div>
    </main>

    <script>
        // ==========================================
        // CANVAS DE PARTÍCULAS ULTRA OTIMIZADO PARA TV
        // ==========================================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // alpha: false melhora performance no canvas

        let width, height;
        let particles = [];
        const particleCount = 38; // Reduzido drasticamente para 60fps lisos na TV

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = (Math.random() - 0.5) * width * 1.2;
                this.y = (Math.random() - 0.5) * height * 1.2;
                this.z = Math.random() * 800 + 1;
                this.vz = -1.2; 
                this.radius = 1.8;
                this.color = Math.random() > 0.5 ? '#00d8ff' : '#0066ff';
            }

            update() {
                this.z += this.vz;
                if (this.z <= 1) {
                    this.reset();
                    this.z = 800;
                }
            }

            draw() {
                const k = 350 / this.z;
                const px = this.x * k + width / 2;
                const py = this.y * k + height / 2;

                if (px < 0 || px > width || py < 0 || py > height) return;

                const alpha = (1 - this.z / 800);

                ctx.beginPath();
                ctx.arc(px, py, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = alpha;
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const p1 = particles[i];
                    const p2 = particles[j];

                    const dx = p1.x - p2.x;
                    const dy = p1.y - p2.y;
                    const dz = p1.z - p2.z;
                    const distSq = dx * dx + dy * dy + dz * dz;

                    // Distância máxima reduzida para cortar processamento desnecessário
                    if (distSq < 15000) {
                        const k1 = 350 / p1.z;
                        const k2 = 350 / p2.z;
                        const x1 = p1.x * k1 + width / 2;
                        const y1 = p1.y * k1 + height / 2;
                        const x2 = p2.x * k2 + width / 2;
                        const y2 = p2.y * k2 + height / 2;

                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.strokeStyle = '#00d8ff';
                        ctx.globalAlpha = 0.15;
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                }
            }
        }

        // Loop principal otimizado
        let lastTime = performance.now();
        let frameCount = 0;
        const fpsElement = document.getElementById('fpsCounter');

        function animate(currentTime) {
            // Fundo escuro direto sem limpar com transparente
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }

            drawConnections();

            // Medidor de FPS
            frameCount++;
            if (currentTime - lastTime >= 1000) {
                if (fpsElement) fpsElement.textContent = `${frameCount} FPS`;
                frameCount = 0;
                lastTime = currentTime;
            }

            requestAnimationFrame(animate);
        }

        // Relógio simples
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

            const dateStr = now.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
            document.getElementById('date').textContent = dateStr;
        }

        setInterval(updateClock, 1000);
        updateClock();

        // Controles de Tela Cheia
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const fullscreenText = document.getElementById('fullscreenText');

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const docEl = document.documentElement;
                if (docEl.requestFullscreen) docEl.requestFullscreen();
                else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        function updateFullscreenUI() {
            const isFS = document.fullscreenElement || document.webkitFullscreenElement;
            if (isFS) {
                fullscreenIcon.className = "fa-solid fa-compress text-base";
                fullscreenText.textContent = "SAIR";
            } else {
                fullscreenIcon.className = "fa-solid fa-expand text-base";
                fullscreenText.textContent = "FULLSCREEN";
            }
        }

        fullscreenBtn.addEventListener('click', toggleFullscreen);
        document.addEventListener('fullscreenchange', updateFullscreenUI);
        document.addEventListener('webkitfullscreenchange', updateFullscreenUI);

        window.onload = function() {
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
